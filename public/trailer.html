<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#161b20" />
    <link rel="icon" href="./assets/art/v21/ui/app-icon-192.png" />
    <meta
      name="description"
      content="《夜行列車：守夜協定》遊戲宣傳片與遊玩入口。"
    />
    <title>宣傳片｜夜行列車：守夜協定</title>
    <style>
      :root {
        color-scheme: dark;
        --night: #11171c;
        --window: #223541;
        --window-light: #8eb3bd;
        --wood: #654331;
        --copper: #c9915b;
        --paper: #ead9b9;
        --ink: #24211d;
        --mist: #c6d4d3;
        --line: rgba(234, 217, 185, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--night);
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--paper);
        background:
          linear-gradient(90deg, rgba(91, 58, 39, 0.32) 1px, transparent 1px) 0 0 / 72px 100%,
          radial-gradient(circle at 78% 24%, rgba(80, 124, 140, 0.3), transparent 34rem),
          linear-gradient(145deg, #1a1a19 0%, var(--night) 55%, #101920 100%);
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      }

      a {
        color: inherit;
      }

      a:focus-visible,
      video:focus-visible {
        outline: 3px solid #f1c27d;
        outline-offset: 4px;
      }

      .page-shell {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
      }

      .site-header {
        min-height: 72px;
        border-bottom: 1px solid var(--line);
      }

      .site-header .page-shell {
        display: flex;
        min-height: 72px;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .brand {
        display:grid;
        min-height:44px;
        align-content:center;
        text-decoration: none;
      }

      .brand strong {
        display: block;
        font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
        font-size: 1.02rem;
        letter-spacing: 0.12em;
      }

      .brand span {
        color: var(--window-light);
        font-size: 0.68rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .repo-link {
        display:inline-flex;
        min-height:44px;
        align-items:center;
        color: var(--mist);
        font-size: 0.86rem;
        text-underline-offset: 0.3em;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(270px, 340px);
        gap: clamp(30px, 5vw, 72px);
        align-items: center;
        min-height: calc(100vh - 72px);
        padding: 34px 0;
      }

      .screen {
        position: relative;
        min-width: 0;
      }

      .screen::before {
        position: absolute;
        inset: -10px;
        z-index: -1;
        border: 1px solid rgba(201, 145, 91, 0.42);
        box-shadow: 0 26px 70px rgba(0, 0, 0, 0.46);
        content: "";
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #080b0d;
        object-fit: contain;
      }

      .media-toolbar { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
      .format-picker { display:flex; gap:4px; }
      .format-picker button,
      .chapter-picker { min-height:48px; border:1px solid var(--line); color:var(--paper); background:#22302d; font:inherit; font-size:0.86rem; border-radius:6px; }
      .format-picker button { min-width:54px; padding:8px; cursor:pointer; }
      .format-picker button[aria-pressed="true"] { color:var(--ink); background:var(--paper); border-color:var(--paper); }
      .chapter-picker { min-width:0; flex:1; padding:8px; }
      .chapter-picker option { color:var(--paper); background:var(--night); }
      .media-toolbar :focus-visible { outline:3px solid #f1c27d; outline-offset:2px; }
      .screen[data-format="portrait"] video { width:auto; height:max(240px,calc(100svh - 320px)); max-height:640px; max-width:100%; aspect-ratio:9 / 16; margin-inline:auto; }
      .player-status { min-height:1.1em; margin:6px 0 0; color:var(--mist); font-size:0.78rem; }

      .platform-label {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 20px 0 0;
        color: #a9bdbc;
        font-family: Consolas, "SFMono-Regular", monospace;
        font-size: 0.72rem;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .platform-label::before {
        width: 38px;
        height: 1px;
        background: var(--copper);
        content: "";
      }

      .intro {
        padding: 20px 0;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--copper);
        font-family: Consolas, "SFMono-Regular", monospace;
        font-size: 0.72rem;
        letter-spacing: 0.15em;
      }

      h1 {
        max-width: 8em;
        margin: 0;
        font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
        font-size: clamp(2.3rem, 4.4vw, 4.7rem);
        font-weight: 700;
        line-height: 1.08;
        letter-spacing: 0.05em;
      }

      .lede {
        max-width: 30em;
        margin: 22px 0 0;
        color: var(--mist);
        font-size: 0.98rem;
        line-height: 1.8;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 18px;
        margin-top: 28px;
      }

      .action {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        padding: 11px 19px;
        border: 1px solid var(--paper);
        color: var(--paper);
        font-weight: 700;
        text-decoration: none;
      }

      .action.primary {
        border-color: var(--paper);
        color: var(--ink);
        background: var(--paper);
      }

      .action:hover {
        border-color: #f3ca8f;
        color: #f3ca8f;
      }

      .action.primary:hover {
        color: #17130f;
        background: #f3ca8f;
      }

      .download {
        margin-top: 22px;
        color: #b7c4c2;
        font-size: 0.82rem;
      }

      .download a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        text-underline-offset: 0.28em;
      }

      @media (max-width: 760px) {
        .page-shell {
          width: min(100% - 28px, 620px);
        }

        .site-header,
        .site-header .page-shell {
          min-height: 62px;
        }

        main {
          grid-template-columns: 1fr;
          gap: 20px;
          min-height: auto;
          padding: 26px 0 40px;
        }

        .screen {
          order: 1;
        }

        .intro {
          order: 2;
          padding: 4px 0 0;
        }

        .platform-label {
          margin-top: 16px;
        }

        h1 {
          max-width: none;
          font-size: clamp(2.18rem, 11vw, 3.4rem);
        }

        .lede {
          margin-top: 16px;
          line-height: 1.7;
        }

        .actions {
          margin-top: 22px;
        }
      }

      @media (max-width: 420px) {
        .repo-link {
          font-size: 0.78rem;
        }

        .brand strong {
          font-size: 0.88rem;
        }

        .brand span {
          display: none;
        }

        .action {
          flex: 1 1 130px;
          padding-inline: 12px;
        }
      }

      @media (min-width: 761px) and (max-height: 680px) {
        main {
          padding: 22px 0;
        }

        h1 {
          font-size: clamp(2.4rem, 4.2vw, 3.6rem);
        }

        .lede {
          margin-top: 16px;
          line-height: 1.55;
        }

        .actions {
          margin-top: 20px;
        }

        .download {
          margin-top: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (max-width:760px) {
        main { padding:12px 0; gap:8px; }
        .media-toolbar { margin-bottom:8px; }
        .site-header,
        .site-header .page-shell { min-height:54px; }
        .screen[data-format="portrait"] video { height:max(180px,calc(100svh - 372px)); }
        .platform-label { margin-top:6px; font-size:0.65rem; letter-spacing:0.03em; }
        .intro { padding:0; }
        .intro .eyebrow,
        .intro .lede,
        .intro h1 { display:none; }
        h1 { font-size:1.2rem; line-height:1.2; }
        .actions { margin-top:8px; gap:8px; }
        .action { min-height:48px; padding:9px 12px; }
        .download { margin:6px 0 0; display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
        .download a { display:inline-flex; min-height:44px; align-items:center; }
        .player-status:empty { min-height:0; margin:0; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="page-shell">
        <a class="brand" href="./" aria-label="返回《夜行列車：守夜協定》遊戲">
          <strong>夜行列車：守夜協定</strong>
          <span>Night Train Watch Protocol</span>
        </a>
        <a class="repo-link" href="https://github.com/mars-tw/night-train-watch-protocol">
          開源專案
        </a>
      </div>
    </header>

    <main class="page-shell">
      <section class="screen" aria-label="遊戲宣傳片">
        <div class="media-toolbar">
          <div class="format-picker" role="group" aria-label="影片畫面方向">
            <button type="button" data-format="landscape" aria-pressed="true">橫式</button>
            <button type="button" data-format="portrait" aria-pressed="false">直式</button>
          </div>
          <select class="chapter-picker" aria-label="選擇要看的玩法片段">
            <option value="">快速看玩法</option>
            <option value="0">開場與車廂</option>
            <option value="10.179">五廂巡覽</option>
            <option value="23.352">料理熱食</option>
            <option value="27.797">任務成果</option>
            <option value="34.397">守夜反制</option>
            <option value="42.266">停站探索</option>
          </select>
        </div>
        <video
          controls
          playsinline
          preload="metadata"
          poster="./assets/video/night-train-promo-v211-cover.jpg"
          aria-label="《夜行列車：守夜協定》遊戲宣傳片"
        >
          <source src="./assets/video/night-train-promo-v211.mp4" type="video/mp4" />
          <track
            default
            kind="subtitles"
            srclang="zh-Hant"
            label="繁體中文"
            src="./assets/video/night-train-promo-v211.zh-Hant.vtt"
          />
          你的瀏覽器無法播放這段影片。你可以直接下載 MP4 觀看。
        </video>
        <p class="player-status" role="status" aria-live="polite"></p>
        <p class="platform-label">v2.1 實際遊玩錄影 · 可切換畫面方向</p>
      </section>

      <section class="intro">
        <p class="eyebrow">七夜旅程／暖車廂／冷窗外</p>
        <h1>守住這班往夜裡開的車</h1>
        <p class="lede">
          白天照顧乘客、修理設備、種植與停站探索；夜裡讀懂窗外留下的線索，決定有限物資要用在哪裡。
        </p>
        <nav class="actions" aria-label="主要連結">
          <a class="action primary" href="./">直接遊玩</a>
          <a class="action" href="https://github.com/mars-tw/night-train-watch-protocol">
            查看 GitHub
          </a>
        </nav>
        <p class="download">
          想離線看？
          <a href="./assets/video/night-train-promo-v211.mp4" download>下載 MP4</a>
          ·
          <a href="./assets/video/night-train-promo-v211-portrait.mp4" download>手機直式版</a>
        </p>
      </section>
    </main>
    <script type="module">
      const player=document.querySelector('video');
      const source=player.querySelector('source');
      const screen=document.querySelector('.screen');
      const status=document.querySelector('.player-status');
      const formats={landscape:{src:'./assets/video/night-train-promo-v211.mp4',poster:'./assets/video/night-train-promo-v211-cover.jpg'},portrait:{src:'./assets/video/night-train-promo-v211-portrait.mp4',poster:'./assets/video/night-train-promo-v211-portrait-cover.jpg'}};
      let selected='landscape';
      let revision=0;
      let desiredTime=0;
      let desiredPlaying=false;
      let metadataHandler;
      const isFormat=value=>value==='landscape'||value==='portrait';
      const startPlayback=()=>player.play().catch(()=>{status.textContent='按播放鍵觀看這個片段。';});
      function selectFormat(format,initial=false){
        if(!isFormat(format))return;
        if(format===selected&&!initial)return;
        desiredPlaying=initial?false:player.readyState>=1?!player.paused:desiredPlaying;
        desiredTime=initial?0:player.readyState>=1?player.currentTime||0:desiredTime;
        const current=++revision;
        selected=format;
        screen.dataset.format=format;
        document.querySelectorAll('.format-picker button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.format===format)));
        player.poster=formats[format].poster;
        source.src=formats[format].src;
        if(metadataHandler)player.removeEventListener('loadedmetadata',metadataHandler);
        metadataHandler=()=>{
          if(current!==revision)return;
          player.currentTime=Math.min(desiredTime,Math.max(0,player.duration-0.1));
          status.textContent='';
          if(desiredPlaying)startPlayback();
        };
        player.addEventListener('loadedmetadata',metadataHandler,{once:true});
        player.load();
        try{localStorage.setItem('ntwp.trailer.format',format);}catch{}
      }
      let preferred;
      try{preferred=localStorage.getItem('ntwp.trailer.format');}catch{}
      selectFormat(isFormat(preferred)?preferred:matchMedia('(max-width:600px)').matches?'portrait':'landscape',true);
      document.querySelectorAll('.format-picker button').forEach(button=>button.addEventListener('click',()=>selectFormat(button.dataset.format)));
      document.querySelector('.chapter-picker').addEventListener('change',event=>{
        if(event.target.value==='')return;
        desiredTime=Number(event.target.value);
        desiredPlaying=true;
        if(player.readyState>=1){player.currentTime=desiredTime;startPlayback();}
        else player.addEventListener('loadedmetadata',()=>{player.currentTime=desiredTime;startPlayback();},{once:true});
        status.textContent='';
      });
      player.addEventListener('error',()=>{status.textContent='影片暫時無法載入，可以使用下方下載連結。';});
    </script>
  </body>
</html>
